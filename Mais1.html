<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Car Studio AI - Pro 3:4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        .aspect-3-4 { aspect-ratio: 3 / 4; width: 100%; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; background: #000; }
        .tab-btn.active { background-color: #2563eb; color: #ffffff; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: #2563eb; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-6">

    <!-- Topo / API -->
    <header class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center max-w-lg mx-auto w-full">
        <h1 class="text-sm font-bold text-blue-400 flex items-center gap-2">🚗 Car Studio AI <span class="text-xs bg-blue-950 text-blue-300 px-2 py-0.5 rounded border border-blue-800">3:4 HD</span></h1>
        <button onclick="configurateAPI()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded border border-slate-700">⚙️ API Photoroom</button>
    </header>

    <!-- Canvas principal 3:4 -->
    <main class="flex-1 flex items-center justify-center p-2">
        <div id="studio-viewport" class="aspect-3-4 rounded-xl border border-slate-800 shadow-2xl flex items-center justify-center relative">
            
            <!-- Camada 1: Fundo (Ordem z-index: 10) -->
            <div id="layer-bg-wrapper" class="absolute inset-0 z-10 overflow-hidden flex items-center justify-center">
                <img id="img-bg" src="" class="hidden object-cover w-full h-full pointer-events-none transition-transform" />
            </div>

            <!-- Camada 2: Carro (Ordem z-index: 20 - Sempre em cima do fundo) -->
            <div id="layer-car-wrapper" class="absolute inset-0 z-20 overflow-hidden flex items-center justify-center">
                <img id="img-car" src="" class="hidden object-contain w-full h-full pointer-events-none transition-transform" />
            </div>

            <!-- Mensagem quando vazio -->
            <div id="empty-state" class="text-center p-4 z-0">
                <p class="text-4xl mb-2">📸</p>
                <p class="text-xs text-slate-400">Carregue a foto do veículo ou do cenário para começar</p>
            </div>
        </div>
    </main>

    <!-- Painel de Controles -->
    <footer class="max-w-lg mx-auto w-full px-3">
        
        <!-- Abas de Navegação -->
        <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl mb-3 border border-slate-800 text-xs">
            <button onclick="setTab('car')" id="tab-car" class="tab-btn active py-2 rounded-lg text-slate-400">🚘 Carro</button>
            <button onclick="setTab('bg')" id="tab-bg" class="tab-btn py-2 rounded-lg text-slate-400">🖼️ Fundo</button>
            <button onclick="setTab('adjust')" id="tab-adjust" class="tab-btn py-2 rounded-lg text-slate-400">🎨 Edição</button>
            <button onclick="setTab('save')" id="tab-save" class="tab-btn py-2 rounded-lg text-slate-400">💾 Salvar</button>
        </div>

        <!-- Conteúdo da Aba: Carro -->
        <div id="panel-car" class="space-y-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <div class="flex gap-2">
                <label class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-3 rounded-lg text-xs font-semibold text-center cursor-pointer">
                    📁 Enviar Carro
                    <input type="file" accept="image/*" class="hidden" onchange="uploadCar(event)">
                </label>
                <button onclick="removeBgApi()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 rounded-lg text-xs font-semibold">✨ Remover Fundo</button>
            </div>
            <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Tamanho do Veículo</label>
                <input type="range" id="car-scale" min="30" max="150" value="100" oninput="updateCarTransform()">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Posição Vertical (Altura)</label>
                <input type="range" id="car-posY" min="-200" max="200" value="0" oninput="updateCarTransform()">
            </div>
        </div>

        <!-- Conteúdo da Aba: Fundo -->
        <div id="panel-bg" class="hidden space-y-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <label class="block w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 px-3 rounded-lg text-xs font-semibold text-center cursor-pointer border border-slate-700">
                🏙️ Trocar Cenário de Fundo
                <input type="file" accept="image/*" class="hidden" onchange="uploadBg(event)">
            </label>
            <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Zoom do Fundo</label>
                <input type="range" id="bg-scale" min="100" max="200" value="100" oninput="updateBgTransform()">
            </div>
        </div>

        <!-- Conteúdo da Aba: Edição (Ajustes para Integração Natural) -->
        <div id="panel-adjust" class="hidden space-y-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Brilho do Carro</label>
                <input type="range" id="car-brightness" min="50" max="150" value="100" oninput="applyFilters()">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Contraste (Adequar à luz do fundo)</label>
                <input type="range" id="car-contrast" min="50" max="150" value="100" oninput="applyFilters()">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Saturação da Cor</label>
                <input type="range" id="car-saturate" min="0" max="200" value="100" oninput="applyFilters()">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Sombra de Contato (Chão)</label>
                <input type="range" id="car-shadow" min="0" max="50" value="10" oninput="applyFilters()">
            </div>
        </div>

        <!-- Conteúdo da Aba: Salvar Foto -->
        <div id="panel-save" class="hidden bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center">
            <p class="text-xs text-slate-400 mb-3">Sua imagem será exportada na proporção 3:4 perfeita para redes sociais.</p>
            <button onclick="downloadImage()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider shadow-lg">
                📥 Salvar Foto em HD (3:4)
            </button>
        </div>

    </footer>

    <script>
        let apiKey = localStorage.getItem('photoroom_key') || '';

        function setTab(tab) {
            ['car', 'bg', 'adjust', 'save'].forEach(t => {
                document.getElementById('panel-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('active');
            });
            document.getElementById('panel-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function configurateAPI() {
            const key = prompt('Cole sua chave de API Photoroom:', apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('photoroom_key', apiKey);
                alert('Chave de API salva!');
            }
        }

        function uploadCar(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = document.getElementById('img-car');
                img.src = evt.target.result;
                img.classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function uploadBg(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = document.getElementById('img-bg');
                img.src = evt.target.result;
                img.classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function updateCarTransform() {
            const scale = document.getElementById('car-scale').value / 100;
            const posY = document.getElementById('car-posY').value;
            document.getElementById('img-car').style.transform = `scale(${scale}) translateY(${posY}px)`;
        }

        function updateBgTransform() {
            const scale = document.getElementById('bg-scale').value / 100;
            document.getElementById('img-bg').style.transform = `scale(${scale})`;
        }

        function applyFilters() {
            const brightness = document.getElementById('car-brightness').value;
            const contrast = document.getElementById('car-contrast').value;
            const saturate = document.getElementById('car-saturate').value;
            const shadow = document.getElementById('car-shadow').value;

            document.getElementById('img-car').style.filter = 
                `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%) drop-shadow(0px ${shadow}px 15px rgba(0,0,0,0.7))`;
        }

        async function removeBgApi() {
            if (!apiKey) {
                alert('Por favor, cadastre sua chave de API Photoroom no botão no topo!');
                return;
            }
            const img = document.getElementById('img-car');
            if (!img.src || img.classList.contains('hidden')) {
                alert('Envie primeiro a foto do carro!');
                return;
            }

            const btn = event.target;
            btn.innerText = 'Processando...';
            btn.disabled = true;

            try {
                const responseFetch = await fetch(img.src);
                const blob = await responseFetch.blob();
                const formData = new FormData();
                formData.append('image_file', blob);

                const res = await fetch('https://sdk.photoroom.com/v1/segment', {
                    method: 'POST',
                    headers: { 'x-api-key': apiKey },
                    body: formData
                });

                if (!res.ok) throw new Error('Erro na API');

                const resultBlob = await res.blob();
                img.src = URL.createObjectURL(resultBlob);
                alert('Fundo removido com sucesso!');
            } catch (err) {
                alert('Falha ao remover fundo. Verifique sua chave de API.');
            } finally {
                btn.innerText = '✨ Remover Fundo';
                btn.disabled = false;
            }
        }

        function downloadImage() {
            const viewport = document.getElementById('studio-viewport');
            html2canvas(viewport, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'foto-carro-3x4.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
