<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Car Studio AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        .aspect-3-4 { aspect-ratio: 3 / 4; width: 100%; max-width: 420px; margin: 0 auto; position: relative; overflow: hidden; background: #111827; }
        .tab-btn.active { background-color: #2563eb; color: #ffffff; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: #2563eb; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-4">

    <header class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center max-w-md mx-auto w-full">
        <h1 class="text-sm font-bold text-blue-400 flex items-center gap-2">🚗 Car Studio AI <span class="text-[10px] bg-blue-950 text-blue-300 px-1.5 py-0.5 rounded border border-blue-800">3:4 HD</span></h1>
        <button onclick="configurateAPI()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded border border-slate-700">⚙️ API Photoroom</button>
    </header>

    <main class="flex-1 flex items-center justify-center p-2">
        <div id="studio-viewport" class="aspect-3-4 rounded-xl border border-slate-800 shadow-2xl flex items-center justify-center relative">
            
            <div id="layer-bg-wrapper" class="absolute inset-0 z-10 overflow-hidden flex items-center justify-center pointer-events-none">
                <img id="img-bg" src="" class="hidden object-cover w-full h-full" />
            </div>

            <div id="layer-car-wrapper" class="absolute inset-0 z-20 overflow-hidden flex items-center justify-center pointer-events-none">
                <img id="img-car" src="" class="hidden object-contain w-full h-full" />
            </div>

            <div id="empty-state" class="text-center p-4 z-0 pointer-events-none">
                <p class="text-3xl mb-1">📸</p>
                <p class="text-xs text-slate-400">Escolha o Veículo e o Cenário abaixo</p>
            </div>
        </div>
    </main>

    <footer class="max-w-md mx-auto w-full px-3">
        
        <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl mb-2 border border-slate-800 text-xs">
            <button onclick="setTab('car')" id="tab-car" class="tab-btn active py-2 rounded-lg text-slate-400">🚘 Carro</button>
            <button onclick="setTab('bg')" id="tab-bg" class="tab-btn py-2 rounded-lg text-slate-400">🖼️ Fundo</button>
            <button onclick="setTab('adjust')" id="tab-adjust" class="tab-btn py-2 rounded-lg text-slate-400">🎨 Edição</button>
            <button onclick="setTab('save')" id="tab-save" class="tab-btn py-2 rounded-lg text-slate-400">💾 Salvar</button>
        </div>

        <div id="panel-car" class="space-y-2 bg-slate-900/90 p-3 rounded-xl border border-slate-800">
            <div class="flex gap-2">
                <label class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 px-2 rounded-lg text-xs font-semibold text-center cursor-pointer">
                    📁 Trocar/Carregar Carro
                    <input type="file" accept="image/*" class="hidden" onchange="uploadCar(event)">
                </label>
                <button onclick="removeBgApi(event)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 rounded-lg text-xs font-semibold">✨ Remover Fundo</button>
            </div>
            <div>
                <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Tamanho (Zoom)</span><span id="val-car-scale">100%</span></div>
                <input type="range" id="car-scale" min="20" max="200" value="100" oninput="updateTransforms()">
            </div>
            <div>
                <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Altura (Vertical)</span><span id="val-car-posY">0px</span></div>
                <input type="range" id="car-posY" min="-150" max="150" value="0" oninput="updateTransforms()">
            </div>
            <div>
                <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Lado (Horizontal)</span><span id="val-car-posX">0px</span></div>
                <input type="range" id="car-posX" min="-150" max="150" value="0" oninput="updateTransforms()">
            </div>
        </div>

        <div id="panel-bg" class="hidden space-y-2 bg-slate-900/90 p-3 rounded-xl border border-slate-800">
            <label class="block w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-lg text-xs font-semibold text-center cursor-pointer border border-slate-700">
                🏙️ Selecionar Foto de Fundo
                <input type="file" accept="image/*" class="hidden" onchange="uploadBg(event)">
            </label>
            <div>
                <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Zoom do Fundo</span><span id="val-bg-scale">100%</span></div>
                <input type="range" id="bg-scale" min="100" max="250" value="100" oninput="updateTransforms()">
            </div>
        </div>

        <div id="panel-adjust" class="hidden space-y-2 bg-slate-900/90 p-3 rounded-xl border border-slate-800">
            <div>
                <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Brilho</span></div>
                <input type="range" id="car-brightness" min="50" max="150" value="100" oninput="applyFilters()">
            </div>
            <div>
                <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Contraste</span></div>
                <input type="range" id="car-contrast" min="50" max="150" value="100" oninput="applyFilters()">
            </div>
            <div>
                <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Sombra no Chão</span></div>
                <input type="range" id="car-shadow" min="0" max="40" value="8" oninput="applyFilters()">
            </div>
        </div>

        <div id="panel-save" class="hidden bg-slate-900/90 p-3 rounded-xl border border-slate-800 text-center space-y-2">
            <p class="text-[11px] text-slate-400">Gera a foto final unindo veículo e fundo em alta resolução.</p>
            <button onclick="downloadImage()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider">
                💾 SALVAR IMAGEM HD (3:4)
            </button>
        </div>

    </footer>

    <script>
        let apiKey = localStorage.getItem('photoroom_key') || '';

        function setTab(tab) {
            ['car', 'bg', 'adjust', 'save'].forEach(t => {
                document.getElementById('panel-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('active');
            });
            document.getElementById('panel-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function configurateAPI() {
            const key = prompt('Cole sua chave de API Photoroom:', apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('photoroom_key', apiKey);
                alert('Chave de API salva com sucesso!');
            }
        }

        function uploadCar(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = document.getElementById('img-car');
                img.src = evt.target.result;
                img.classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
                updateTransforms();
            };
            reader.readAsDataURL(file);
        }

        function uploadBg(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = document.getElementById('img-bg');
                img.src = evt.target.result;
                img.classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
                updateTransforms();
            };
            reader.readAsDataURL(file);
        }

        function updateTransforms() {
            // Carro
            const scaleC = document.getElementById('car-scale').value;
            const posY = document.getElementById('car-posY').value;
            const posX = document.getElementById('car-posX').value;
            document.getElementById('val-car-scale').innerText = scaleC + '%';
            document.getElementById('val-car-posY').innerText = posY + 'px';
            document.getElementById('val-car-posX').innerText = posX + 'px';
            
            document.getElementById('img-car').style.transform = `translate(${posX}px, ${posY}px) scale(${scaleC / 100})`;

            // Fundo
            const scaleB = document.getElementById('bg-scale').value;
            document.getElementById('val-bg-scale').innerText = scaleB + '%';
            document.getElementById('img-bg').style.transform = `scale(${scaleB / 100})`;
        }

        function applyFilters() {
            const b = document.getElementById('car-brightness').value;
            const c = document.getElementById('car-contrast').value;
            const s = document.getElementById('car-shadow').value;

            document.getElementById('img-car').style.filter = 
                `brightness(${b}%) contrast(${c}%) drop-shadow(0px ${s}px 12px rgba(0,0,0,0.85))`;
        }

        async function removeBgApi(e) {
            if (!apiKey) {
                alert('Cole sua chave de API Photoroom no botão "⚙️ API Photoroom" no topo!');
                return;
            }
            const img = document.getElementById('img-car');
            if (!img.src || img.classList.contains('hidden')) {
                alert('Carregue primeiro uma foto de carro!');
                return;
            }

            const btn = e.target;
            const origText = btn.innerText;
            btn.innerText = 'Processando...';
            btn.disabled = true;

            try {
                const responseFetch = await fetch(img.src);
                const blob = await responseFetch.blob();
                const formData = new FormData();
                formData.append('image_file', blob);

                const res = await fetch('https://sdk.photoroom.com/v1/segment', {
                    method: 'POST',
                    headers: { 'x-api-key': apiKey },
                    body: formData
                });

                if (!res.ok) throw new Error('Chave inválida ou erro na API');

                const resultBlob = await res.blob();
                img.src = URL.createObjectURL(resultBlob);
                alert('Fundo do carro removido com sucesso!');
            } catch (err) {
                alert('Não foi possível remover o fundo. Verifique a chave de API.');
            } finally {
                btn.innerText = origText;
                btn.disabled = false;
            }
        }

        function downloadImage() {
            const viewport = document.getElementById('studio-viewport');
            
            html2canvas(viewport, { 
                scale: 3, 
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#111827'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'car-studio-3x4.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
